<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Directive 17 — The Future Should Make Life Better.</title>
<meta name="description" content="We build companies that improve the human experience.">
<link rel="icon" type="image/png" href="images/logos/enso.png">
<style>
:root{--bg:#FBF7EC;--panel:#F4EEDD;--ink:#23392C;--deep:#203C2D;--muted:#71806B;
--line:#E6DEC7;--accent:#D98B33;
--serif:Georgia,'Times New Roman',serif;
--sans:'Helvetica Neue',Helvetica,Arial,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--serif);font-size:17.5px;
line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
::selection{background:var(--deep);color:var(--bg)}
.wrap{max-width:1100px;margin:0 auto;padding:0 24px}
/* nav */
header{position:sticky;top:0;z-index:10;background:rgba(251,247,236,.92);
backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;
flex-wrap:wrap;min-height:72px;padding-top:10px;padding-bottom:10px}
.logo{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-weight:700;
font-size:1.2rem;letter-spacing:.01em;color:var(--deep)}
.logo img{height:38px;width:38px;object-fit:contain}
.menu-btn{display:flex;flex-direction:column;gap:6px;background:none;border:none;
cursor:pointer;padding:12px 4px}
.menu-btn span{display:block;width:28px;height:2px;background:var(--deep);border-radius:2px}
.menu-overlay{position:fixed;inset:0;background:var(--deep);z-index:100;display:none;
flex-direction:column;justify-content:center;padding:0 max(8vw,32px)}
.menu-overlay.open{display:flex}
.menu-overlay .m-label{font-family:var(--sans);font-size:.74rem;font-weight:700;
text-transform:uppercase;letter-spacing:.2em;color:var(--accent);margin-bottom:28px}
.menu-overlay a{font-family:var(--serif);font-size:clamp(1.5rem,4.2vw,2.4rem);
color:#F5F1E2;padding:12px 0;letter-spacing:-.01em;transition:color .15s;line-height:1.2}
.menu-overlay a:hover,.menu-overlay a.active{color:var(--accent)}
.menu-close{position:absolute;top:26px;right:max(8vw,32px);background:none;border:none;
cursor:pointer;color:#F5F1E2;font-size:2.2rem;line-height:1;font-family:var(--serif)}
.menu-close:hover{color:var(--accent)}
/* hero */
.hero{padding:100px 0 84px;border-bottom:1px solid var(--line)}
.hero-home{min-height:calc(100vh - 73px);display:flex;align-items:center;
border-bottom:none;padding:40px 0}
.hero-flex{display:flex;align-items:center;gap:56px;justify-content:space-between}
.hero-enso{flex:0 0 auto;width:min(300px,30vw)}
.hero-enso img{width:100%;height:auto}
.kicker{font-family:var(--sans);font-size:.74rem;font-weight:700;text-transform:uppercase;
letter-spacing:.2em;color:var(--accent);margin-bottom:24px}
h1.display{font-family:var(--serif);font-weight:700;letter-spacing:-.01em;
font-size:clamp(2.5rem,5.8vw,4.4rem);line-height:1.08;max-width:17ch;color:var(--deep)}
.sub{color:var(--muted);font-size:1.2rem;max-width:50ch;margin-top:26px}
/* sections */
section{padding:80px 0;border-bottom:1px solid var(--line)}
.sec-label{font-family:var(--sans);font-size:.74rem;font-weight:700;text-transform:uppercase;
letter-spacing:.2em;color:var(--muted);margin-bottom:14px}
.sec-title{font-family:var(--serif);font-size:clamp(1.6rem,3vw,2.2rem);color:var(--deep);
letter-spacing:-.01em;margin-bottom:40px;max-width:30ch;line-height:1.3}
.pillars{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px}
.pillar{background:var(--panel);padding:30px 26px;border-radius:10px}
.pillar .num{font-family:var(--sans);font-size:.72rem;font-weight:700;color:var(--accent);
letter-spacing:.16em;margin-bottom:14px}
.pillar h3{font-family:var(--serif);font-size:1.25rem;color:var(--deep);margin-bottom:10px}
.pillar p{color:var(--muted);font-size:.95rem;line-height:1.55}
/* company cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:22px}
.grid-home{grid-template-columns:repeat(3,1fr)}
@media(max-width:600px){.grid-home{grid-template-columns:repeat(2,1fr)}}
.card{display:block;text-align:center}
.tile{border-radius:12px;height:110px;display:flex;align-items:center;justify-content:center;
padding:18px;transition:transform .15s,box-shadow .15s}
.card:hover .tile{transform:translateY(-3px);box-shadow:0 6px 18px rgba(32,60,45,.14)}
.tile-dark{background:var(--deep)}
.tile-light{background:#FDFBF3;border:1px solid var(--line)}
.tile img{max-width:82%;max-height:74px;object-fit:contain}
.card h3{font-family:var(--sans);font-size:.86rem;font-weight:600;color:var(--ink);
margin-top:14px;line-height:1.35}
.card p{color:var(--muted);font-size:.85rem;margin-top:6px}
.group-label{font-family:var(--sans);font-size:.74rem;font-weight:700;text-transform:uppercase;
letter-spacing:.18em;color:var(--accent);margin:56px 0 28px}
.group-label:first-of-type{margin-top:0}
/* blog accordion */
.acc{border-bottom:1px solid var(--line)}
.acc-head{display:flex;align-items:center;gap:18px;width:100%;padding:28px 0;cursor:pointer;
background:none;border:none;text-align:left;font:inherit;color:inherit}
.acc-head .meta{flex:1;min-width:0}
.acc-head .date{font-family:var(--sans);font-size:.72rem;font-weight:600;color:var(--muted);
text-transform:uppercase;letter-spacing:.16em}
.acc-head h3{font-family:var(--serif);font-size:clamp(1.2rem,2.6vw,1.6rem);color:var(--deep);
margin-top:8px;letter-spacing:-.01em;transition:color .15s;line-height:1.3}
.acc-head:hover h3{color:var(--accent)}
.chev{flex:0 0 auto;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;
display:flex;align-items:center;justify-content:center;color:var(--muted);
transition:transform .2s,color .15s;font-size:.9rem}
.acc.open .chev{transform:rotate(45deg);color:var(--accent);border-color:var(--accent)}
.share-btn{flex:0 0 auto;font-family:var(--sans);font-size:.68rem;font-weight:700;
text-transform:uppercase;letter-spacing:.14em;color:var(--muted);background:none;
border:1px solid var(--line);border-radius:6px;padding:9px 14px;cursor:pointer;
transition:all .15s;white-space:nowrap}
.share-btn:hover{color:var(--deep);border-color:var(--deep)}
.acc-body{display:none;max-width:68ch;padding:6px 0 44px}
.acc.open .acc-body{display:block}
.acc-body p{margin:0 0 20px}
.acc-body h2{font-family:var(--serif);font-size:1.5rem;color:var(--deep);margin:44px 0 16px}
.acc-body strong{color:var(--deep)}
.acc-body em{color:var(--muted)}
.acc-body ul,.acc-body ol{margin:0 0 20px 24px}
.acc-body blockquote{border-left:3px solid var(--accent);padding:6px 0 6px 24px;margin:28px 0;
font-size:1.25rem;line-height:1.5;color:var(--deep);font-style:italic}
.acc-body blockquote p{margin:0}
/* blog list */
.post-row{display:block;padding:30px 0;border-bottom:1px solid var(--line)}
.post-row:hover h3{color:var(--accent)}
.post-row .date{font-family:var(--sans);font-size:.72rem;font-weight:600;color:var(--muted);
text-transform:uppercase;letter-spacing:.16em}
.post-row h3{font-family:var(--serif);font-size:1.5rem;color:var(--deep);margin:10px 0 8px;
transition:color .15s;letter-spacing:-.01em}
.post-row p{color:var(--muted);max-width:64ch}
/* article + prose */
.prose{max-width:68ch;padding:70px 0 90px}
.prose h1{font-family:var(--serif);font-size:clamp(2rem,4.5vw,3rem);color:var(--deep);
letter-spacing:-.01em;line-height:1.12;margin-bottom:28px}
.prose h2{font-family:var(--serif);font-size:1.6rem;color:var(--deep);margin:48px 0 16px}
.prose h3{font-family:var(--serif);font-size:1.2rem;color:var(--deep);margin:32px 0 12px}
.prose p{margin:0 0 20px}
.prose ul,.prose ol{margin:0 0 20px 24px}
.prose li{margin-bottom:10px}
.prose strong{color:var(--deep)}
.prose a{color:var(--accent)}
.prose blockquote{border-left:3px solid var(--accent);padding:6px 0 6px 24px;margin:28px 0;
font-size:1.35rem;line-height:1.5;color:var(--deep);font-style:italic}
.prose blockquote p{margin:0}
.prose hr{border:none;border-top:1px solid var(--line);margin:40px 0}
.prose .date{font-family:var(--sans);font-size:.72rem;font-weight:700;color:var(--accent);
text-transform:uppercase;letter-spacing:.18em;margin-bottom:18px}
/* cta + footer */
.cta{padding:90px 0}
.cta h2{font-family:var(--serif);font-size:clamp(1.7rem,3.6vw,2.6rem);color:var(--deep);
letter-spacing:-.01em;max-width:26ch;margin-bottom:24px;line-height:1.25}
.btn{display:inline-block;font-family:var(--sans);font-size:.76rem;font-weight:700;
text-transform:uppercase;letter-spacing:.16em;background:var(--deep);color:var(--bg);
padding:15px 30px;border-radius:6px;margin-top:8px;transition:background .15s}
.btn:hover{background:#2C5240}
.btn-ghost{background:transparent;color:var(--deep);border:1px solid var(--deep)}
.btn-ghost:hover{background:var(--deep);color:var(--bg)}
footer{background:var(--deep);color:#D8DDCF;padding:56px 0;font-size:.9rem}
footer .frow{display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center}
footer a{color:#F0EDDC}footer a:hover{color:var(--accent)}
footer .fmono{font-family:var(--sans);font-size:.72rem;font-weight:600;
text-transform:uppercase;letter-spacing:.16em}
@media(max-width:760px){.hero{padding:64px 0 56px}section{padding:56px 0}
.hero-flex{flex-direction:column-reverse;align-items:flex-start;gap:36px}
.hero-enso{width:130px}}
</style>
</head>
<body>
<header><div class="wrap nav">
<a class="logo" href="index.html"><img src="images/logos/enso.png" alt="Directive 17 enso logo">Directive 17</a>
<button class="menu-btn" id="menu-btn" aria-label="Open menu" aria-expanded="false">
<span></span><span></span><span></span>
</button>
</div></header>
<nav class="menu-overlay" id="menu" aria-hidden="true">
<button class="menu-close" id="menu-close" aria-label="Close menu">&times;</button>
<div class="m-label">Directive 17</div>

</nav>

<div class="hero hero-home"><div class="wrap hero-flex">
<div>
<div class="kicker">Directive 17</div>
<h1 class="display">The Future Should Make Life Better.</h1>
<p class="sub">We build companies that improve the human experience.</p>
</div>
<div class="hero-enso"><img src="images/logos/enso.png" alt="Directive 17 enso"></div>
</div></div>
<footer><div class="wrap frow">
<div class="fmono">Directive 17 &copy; 2026</div>
<div><a href="mailto:joel@directive17.com">joel@directive17.com</a></div>
</div></footer>
<script>
(function() {
  var btn = document.getElementById('menu-btn');
  var menu = document.getElementById('menu');
  var close = document.getElementById('menu-close');
  function setOpen(open) {
    menu.classList.toggle('open', open);
    menu.setAttribute('aria-hidden', String(!open));
    btn.setAttribute('aria-expanded', String(open));
    document.body.style.overflow = open ? 'hidden' : '';
  }
  btn.addEventListener('click', function() { setOpen(true); });
  close.addEventListener('click', function() { setOpen(false); });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') setOpen(false);
  });
})();
</script>
</body>
</html>
